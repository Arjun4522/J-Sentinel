server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
j-sentinel.upload-dir=/tmp/j-sentinel/uploads
j-sentinel.output-dir=/tmp/j-sentinel/outputs
spring.security.user.name=user
spring.security.user.password=secret
spring.codec.max-in-memory-size=100MB
logging.level.com.example.api_gateway=DEBUG
spring.datasource.url=jdbc:sqlite:projects.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.dialect.SQLiteDialect
spring.jpa.properties.hibernate.dialect=com.example.api_gateway.config.SQLiteDialect
spring.jpa.database-platform=com.example.api_gateway.config.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

