server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
j-sentinel.upload-dir=/tmp/j-sentinel/uploads
j-sentinel.output-dir=/tmp/j-sentinel/outputs
spring.security.user.name=user
spring.security.user.password=secret
spring.codec.max-in-memory-size=100MB
logging.level.com.example.api_gateway=DEBUG

# Rule Engine Configuration
RULE_ENGINE_DIR=/home/arjun/Desktop/J-Sentinel/rule-engine
REPORTS_DIR=/home/arjun/Desktop/J-Sentinel/rule-engine/reports

# Database Configuration
JSENTINEL_DB_PATH=/home/arjun/Desktop/J-Sentinel/rule-engine/reports/data.db
JSENTINEL_HISTORY_DB_PATH=/home/arjun/Desktop/J-Sentinel/rule-engine/reports/data.db
spring.datasource.url=jdbc:sqlite:${JSENTINEL_DB_PATH}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=com.example.api_gateway.config.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true